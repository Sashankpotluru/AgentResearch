[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentresearch"
version = "0.1.0"
description = "Resumable claim investigation with exact evidence spans and source-withdrawal audits"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]
license = "MIT"

[project.optional-dependencies]
model = [
    "torch==2.15.0",
    "transformers==5.23.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "sentencepiece==0.2.3",
    "certifi==2026.10.23",
]
mcp = ["mcp==2.3.0", "mcp-types==2.3.0"]
test = ["pytest==9.2.0"]

[tool.setuptools.data-files]
"share/agentresearch" = ["data/sources.json", "data/model-lock.json"]

[project.scripts]
agentresearch = "agentresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
