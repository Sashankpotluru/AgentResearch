<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 538" role="img" aria-labelledby="title description">
  <title id="title">AgentResearch investigation and evaluation architecture</title>
  <desc id="description">Pinned ATT&amp;CK and TRAM records become two corpora. The Python investigator reads ATT&amp;CK evidence and saves scored excerpts, checkpoints and source withdrawals for browser replay. Separate evaluations measure canonical source-record Recall@5 for ATT&amp;CK and match TRAM sentences to technique definitions. Model policy results use 64 positive-derived claims.</desc>
  <defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4 0 8z" fill="#657386"/></marker></defs>
  <style>
    text { font-family: Helvetica Neue, Helvetica, Arial, sans-serif; fill: #17202e; }
    .name { font-weight: 700; font-size: 20px; }
    .copy { font-size: 16px; fill: #49596c; }
    .arrow { fill: none; stroke: #657386; stroke-width: 2; marker-end: url(#tip); }
    .box { fill: white; stroke: #c2cbd4; }
  </style>
  <rect width="860" height="538" fill="#f4f6f8"/>
  <path fill="#17202e" d="M0 0h860v64H0z"/>
  <path fill="#b4233e" d="M0 0h8v64H0z"/>
  <text x="26" y="41" style="fill:white;font-size:27px;font-weight:700">AgentResearch</text>
  <text x="835" y="39" text-anchor="end" style="fill:#d7dde4;font-size:16px">Evidence and evaluation</text>
  <g>
    <rect class="box" x="25" y="86" width="389" height="66" rx="4"/>
    <text class="name" x="44" y="113">Enterprise ATT&amp;CK</text>
    <text class="copy" x="44" y="137">Pinned malware, techniques and citations</text>
    <rect class="box" x="446" y="86" width="389" height="66" rx="4"/>
    <text class="name" x="465" y="113">TRAM report annotations</text>
    <text class="copy" x="465" y="137">Pinned sentences and technique labels</text>
    <path class="arrow" d="M220 153v27"/>
    <path class="arrow" d="M641 153v27"/>
    <rect class="box" x="25" y="183" width="810" height="67" rx="4"/>
    <text class="name" x="44" y="211">Prepared corpora</text>
    <text class="copy" x="44" y="235">Procedure summaries grouped by canonical URL</text>
    <text class="copy" x="465" y="235">Technique definitions and labeled sentences</text>
    <path class="arrow" d="M220 251v27"/>
    <path class="arrow" d="M641 251v27"/>
    <rect class="box" x="25" y="281" width="389" height="103" rx="4"/>
    <text class="name" x="44" y="311">Python investigator</text>
    <text class="copy" x="44" y="337">Search, read and score exact excerpts.</text>
    <text class="copy" x="44" y="361">Checkpoint calls and audit withdrawals.</text>
    <rect class="box" x="446" y="281" width="389" height="103" rx="4"/>
    <text class="name" x="465" y="311">Retrieval benchmarks</text>
    <text class="copy" x="465" y="337">ATT&amp;CK query → canonical source record</text>
    <text class="copy" x="465" y="361">TRAM sentence → technique definition</text>
    <path class="arrow" d="M220 385v31"/>
    <path class="arrow" d="M641 385v31"/>
    <rect class="box" x="25" y="420" width="389" height="91" rx="4"/>
    <path fill="#b4233e" d="M25 420h4v91h-4z"/>
    <text class="name" x="44" y="449">Saved investigations</text>
    <text class="copy" x="44" y="475">Replay 24 cases in the Pages browser.</text>
    <text class="copy" x="44" y="497">Evaluate model policies on 64 separate cases.</text>
    <rect class="box" x="446" y="420" width="389" height="91" rx="4"/>
    <text class="name" x="465" y="449">Measured rankings</text>
    <text class="copy" x="465" y="475">Save query-level results and paired intervals.</text>
    <text class="copy" x="465" y="497">Inspect comparisons in the Evaluation view.</text>
  </g>
</svg>
